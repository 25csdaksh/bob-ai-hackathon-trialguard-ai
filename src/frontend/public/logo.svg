<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Square Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Shield Shape -->
  <path d="M50 15 L78 26 C78 54 66 74 50 85 C34 74 22 54 22 26 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="5.5" stroke-linejoin="round" />

  <!-- Heartbeat / Telemetry Pulse & AI Node -->
  <path d="M28 50 H38 L43 38 L50 62 L57 44 L62 50 H72" fill="none" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing AI Center Pulse -->
  <circle cx="50" cy="50" r="5" fill="#38BDF8" filter="url(#glow)" />
</svg>
